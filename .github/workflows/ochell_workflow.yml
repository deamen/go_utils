name: "Build ochell"

on:
  push:
    branches: [ "master" ]
    paths:
      - 'ochell/**'
      - '.github/workflows/ochell_workflow.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'ochell/**'
      - '.github/workflows/ochell_workflow.yml'

  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.1.7

      - name: Setup Go
        uses: actions/setup-go@v5.0.1
        with:
          go-version-file: ochell/go.mod

      - name: Vet and test
        run: make test
        working-directory: ./ochell

      # The container sandbox with the runner's own rootless podman: no
      # registry, the image is made from the fake agent.
      - name: Test the podman launcher with a real podman
        run: podman --version && OCHELL_E2E_PODMAN=1 go test ./e2e/ -run TestPodmanSandbox -count=1 -v
        working-directory: ./ochell

      - name: Build ochell binaries
        run: make
        working-directory: ./ochell
