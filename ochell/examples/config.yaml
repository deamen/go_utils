# ochell example configuration.
# Precedence: built-in defaults < this file < command line flags.
# ${VAR} references are replaced with environment variables at load time;
# keep secrets in the environment, not in this file.

log_level: info

http:
  enabled: true
  address: 127.0.0.1        # ngrok forwards to localhost
  port: 8080

https:
  enabled: false
  address: 0.0.0.0
  port: 8443
  cert_file: /etc/ochell/tls.crt
  key_file: /etc/ochell/tls.key

# The SQLite file with the tickets, the task queue and the handled webhook
# deliveries. It is created when missing. Keep it where the agent cannot
# read it.
store:
  path: /var/lib/ochell/ochell.db

agent:
  # One agent process is started per ticket; it manages any sub-agents itself.
  command: claude
  # Arguments are Go templates rendered per task and passed without a shell.
  # Available fields: .ID .Source .Key. Keep ticket text (.Title .URL .Context
  # .Prompt) out of arguments: they are visible in the process list.
  args:
    - -p
    - --permission-mode
    - acceptEdits
  # The prompt is written to the agent's stdin. "arg" passes it as an argument
  # instead (add "{{.Prompt}}" to args): it is then visible in the process
  # list and limited to 128 KB, so use it only for a CLI that cannot read stdin.
  prompt_via: stdin
  prompt_template: |
    You are the digital employee assigned {{.Source}} ticket {{.Key}} ({{.URL}}).
    Use twg to retrieve the full ticket details, complete the task, and open a pull request.
    {{- if .Context}}

    Context provided by {{.Source}}:
    {{.Context}}
    {{- end}}
    {{- if .RunContext}}

    {{.RunContext}}
    {{- end}}

    {{.ResultInstructions}}
  workdir: /work/{{.Source}}/{{.Key}}
  # One directory per run, where the agent leaves its result file for ochell
  # (the path is in its environment as ORCH_RESULT_FILE). Keep it outside
  # the working directories. The prompt template must include
  # {{.ResultInstructions}}, which tells the agent what to write, and
  # {{.RunContext}}, which tells a later attempt about the earlier ones.
  run_dir: /work/runs
  # The kind of agent CLI: how it is called and how its output is read.
  #   plain    any CLI: the prompt goes in, the last part of the output is
  #            the result.
  #   claude   Claude Code with its event stream: the final message, the
  #            session id and the cost are recorded, and a ticket that runs
  #            again resumes its session. It adds --output-format stream-json
  #            --verbose (and --resume) itself; leave them out of args.
  adapter: claude
  # How the agent process is run:
  #   direct   a child process of ochell, under ochell's own OS user. For
  #            development; the agent can read ochell's files.
  #   systemd  a transient unit under a separate OS user, started and stopped
  #            through two root-owned scripts (see README, "Launchers").
  #            Requires prompt_via: stdin and an absolute command, workdir and
  #            run_dir; args and workdir may only use .ID .Source .Key;
  #            env_pass is not used. ochell must be in the agent user's group
  #            to read the result files.
  launcher: direct
  systemd:
    launch_command: [sudo, -n, /usr/local/libexec/ochell/ochell-launch]
    stop_command: [sudo, -n, /usr/local/libexec/ochell/ochell-stop]
  # Time between SIGTERM and SIGKILL when a run is stopped, at the time limit
  # or on shutdown. The whole agent is stopped, with its children.
  stop_grace: 10s
  # How long a shutdown waits for running agents before it stops them. If
  # ochell is a systemd service, keep the service's TimeoutStopSec above
  # drain_timeout + stop_grace.
  drain_timeout: 30s
  # The agent does not inherit ochell's environment, which holds the secrets
  # above. Only the variables named here are copied from it. This is the
  # default list; add the agent's own credential (e.g. ANTHROPIC_API_KEY) if
  # it comes from the environment.
  env_pass: [PATH, HOME, USER, LOGNAME, SHELL, LANG, LC_ALL, LC_CTYPE, TZ, TMPDIR,
             HTTP_PROXY, HTTPS_PROXY, NO_PROXY, http_proxy, https_proxy, no_proxy,
             SSL_CERT_FILE, SSL_CERT_DIR]
  # Set for the agent in addition to env_pass and ORCH_TASK_*.
  env:
    CI: "true"
  timeout: 2h
  max_concurrent: 1
  queue_size: 100
  log_dir: /var/log/ochell

sources:
  # Jira system webhook (Settings > System > WebHooks) with a secret.
  # Suggested JQL filter: assignee = <bot accountId>
  jira_webhook:
    enabled: true
    path: /webhooks/jira
    secret: ${JIRA_WEBHOOK_SECRET}
    bot_account_id: "712020:00000000-0000-0000-0000-000000000000"
    # A payload whose "timestamp" is further than this from now is rejected,
    # so a captured request cannot be replayed later. Jira retries a failed
    # delivery up to five times, 5 to 15 minutes apart, and a retry may carry
    # the timestamp of the event, so keep this above 75 minutes.
    max_skew: 2h

  # Jira Automation "Send web request" with a hidden header.
  jira_automation:
    enabled: true
    path: /webhooks/jira-automation
    header: Authorization   # Automation sends "Authorization: Bearer <token>"
    token: ${JIRA_AUTOMATION_TOKEN}
    # When set, the payload must name this account as the assignee: another
    # assignee is ignored, no assignee is rejected with 400. Leave it out
    # only if the rule's own condition is all you want to rely on.
    bot_account_id: "712020:00000000-0000-0000-0000-000000000000"

  # Linear agent app (OAuth app installed with actor=app).
  linear:
    enabled: true
    path: /webhooks/linear
    secret: ${LINEAR_WEBHOOK_SECRET}
    max_skew: 60s
    client_id: ${LINEAR_CLIENT_ID}
    client_secret: ${LINEAR_CLIENT_SECRET}
    redirect_url: https://example.ngrok-free.app/oauth/linear/callback
    callback_path: /oauth/linear/callback
    token_file: /var/lib/ochell/linear-token.json
    organization_id: ""     # optional: only accept installs into this workspace
    external_url: ""        # optional: e.g. https://runs.example.com/{{.ID}}

# In-process source IP filtering. Use it when the orchestrator is reached
# directly; behind ngrok prefer ngrok's restrict-ips (see ngrok-policy.yaml).
ip_allowlist:
  enabled: false
  atlassian_feed: true
  linear_feed: true
  extra_cidrs: []
  refresh: 1h
  trust_proxy_header: false

# Keeps ngrok IP policies in sync with the Atlassian and Linear feeds.
ngrok_sync:
  enabled: false
  api_key: ${NGROK_API_KEY}
  atlassian_policy_id: ipp_xxxxxxxxxxxxxxxxxxxxxxxxxxx
  linear_policy_id: ipp_yyyyyyyyyyyyyyyyyyyyyyyyyyy
  interval: 6h
