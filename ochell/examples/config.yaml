# ochell example configuration.
# Precedence: built-in defaults < this file < command line flags.
# ${VAR} references are replaced with environment variables at load time;
# keep secrets in the environment, not in this file.

log_level: info

http:
  enabled: true
  address: 127.0.0.1        # ngrok forwards to localhost
  port: 8080

https:
  enabled: false
  address: 0.0.0.0
  port: 8443
  cert_file: /etc/ochell/tls.crt
  key_file: /etc/ochell/tls.key

# The admin channel: a unix socket on which the running ochell takes the
# commands "ochell pause", "resume", "status", "reset" and "stop". Only ochell's own
# OS user can open it. Keep it where the agent cannot write.
admin:
  socket: /run/ochell/admin.sock

# The SQLite file with the tickets, the task queue and the handled webhook
# deliveries. It is created when missing. Keep it where the agent cannot
# read it.
store:
  path: /var/lib/ochell/ochell.db

# Which repository a ticket belongs to. "project" is the Jira project key or
# the Linear team key (DEV in DEV-42); "*" matches every project. "label" is
# optional. The first entry that matches wins. A ticket that no entry
# matches is not started and waits for a human. Leave "repos" out to run
# every ticket without a repository.
repos:
  - {source: jira, project: DEV, label: frontend, repo: "git@github.com:example/web.git"}
  - {source: jira, project: DEV, repo: "git@github.com:example/backend.git"}
  - {source: linear, project: ENG, repo: "git@github.com:example/engine.git"}

# The working directory of a ticket (agent.workdir): where it may be, how it
# is prepared, and when it is removed. The hooks are commands that ochell
# runs in the working directory, as the same OS user as the agent. They get
# ORCH_TASK_REPO and ORCH_TASK_BRANCH in their environment.
workspace:
  # Every working directory must be inside this directory.
  root: /work
  branch: "bot/{{.Key}}"
  hooks:
    # Once, before the first run in a new working directory.
    after_create: [/bin/sh, -c, 'git clone "$ORCH_TASK_REPO" . && git checkout -b "$ORCH_TASK_BRANCH"']
    # Before every run.
    before_run: [/bin/sh, -c, 'git fetch origin']
    # after_run: []       after every run in which the agent was started
    # before_remove: []   before the working directory is removed
  hook_timeout: 10m
  # Remove a ticket's working directory when Jira or Linear reports the
  # ticket as closed. Needs root, and {{.Key}} in agent.workdir.
  cleanup: true

# The safety net behind the webhooks: at start and then at this interval,
# ochell asks Jira (needs sources.jira_api) and Linear for the bot's open
# tickets. It starts a ticket it has never seen, and stops the agent of one
# that was closed or taken away from the bot. 0s turns it off.
# On the first start with the poller, every open ticket of the bot is
# started: check the list with "ochell jira-check" first.
poller:
  interval: 5m

agent:
  # One agent process is started per ticket; it manages any sub-agents itself.
  command: claude
  # Arguments are Go templates rendered per task and passed without a shell.
  # Available fields: .ID .Source .Key. Keep ticket text (.Title .URL .Context
  # .Prompt) out of arguments: they are visible in the process list.
  args:
    - -p
    - --permission-mode
    - acceptEdits
  # The prompt is written to the agent's stdin. "arg" passes it as an argument
  # instead (add "{{.Prompt}}" to args): it is then visible in the process
  # list and limited to 128 KB, so use it only for a CLI that cannot read stdin.
  prompt_via: stdin
  prompt_template: |
    You are the digital employee assigned {{.Source}} ticket {{.Key}} ({{.URL}}).
    Use twg to retrieve the full ticket details, complete the task, and open a pull request.
    {{- if .Repo}}
    The repository for this ticket is {{.Repo}}.
    {{- end}}
    {{- if .Context}}

    Context provided by {{.Source}}:
    {{.Context}}
    {{- end}}
    {{- if .RunContext}}

    {{.RunContext}}
    {{- end}}

    {{.ResultInstructions}}
  workdir: /work/{{.Source}}/{{.Key}}
  # One directory per run, where the agent leaves its result file for ochell
  # (the path is in its environment as ORCH_RESULT_FILE). Keep it outside
  # the working directories. The prompt template must include
  # {{.ResultInstructions}}, which tells the agent what to write, and
  # {{.RunContext}}, which tells a later attempt about the earlier ones.
  run_dir: /work/runs
  # The kind of agent CLI: how it is called and how its output is read.
  #   plain    any CLI: the prompt goes in, the last part of the output is
  #            the result.
  #   claude   Claude Code with its event stream: the final message, the
  #            session id and the cost are recorded, and a ticket that runs
  #            again resumes its session. It adds --output-format stream-json
  #            --verbose (and --resume) itself; leave them out of args.
  adapter: claude
  # How the agent process is run:
  #   direct   a child process of ochell, under ochell's own OS user. For
  #            development; the agent can read ochell's files.
  #   systemd  a transient unit under a separate OS user, started and stopped
  #            through two root-owned scripts (see README, "Launchers").
  #            Requires prompt_via: stdin and an absolute command, workdir and
  #            run_dir; args and workdir may only use .ID .Source .Key;
  #            env_pass is not used. ochell must be in the agent user's group
  #            to read the result files.
  launcher: direct
  systemd:
    launch_command: [sudo, -n, /usr/local/libexec/ochell/ochell-launch]
    stop_command: [sudo, -n, /usr/local/libexec/ochell/ochell-stop]
  # Time between SIGTERM and SIGKILL when a run is stopped, at the time limit
  # or on shutdown. The whole agent is stopped, with its children.
  stop_grace: 10s
  # How long a shutdown waits for running agents before it stops them. If
  # ochell is a systemd service, keep the service's TimeoutStopSec above
  # drain_timeout + stop_grace.
  drain_timeout: 30s
  # The agent does not inherit ochell's environment, which holds the secrets
  # above. Only the variables named here are copied from it. This is the
  # default list; add the agent's own credential (e.g. ANTHROPIC_API_KEY) if
  # it comes from the environment.
  env_pass: [PATH, HOME, USER, LOGNAME, SHELL, LANG, LC_ALL, LC_CTYPE, TZ, TMPDIR,
             HTTP_PROXY, HTTPS_PROXY, NO_PROXY, http_proxy, https_proxy, no_proxy,
             SSL_CERT_FILE, SSL_CERT_DIR]
  # Set for the agent in addition to env_pass and ORCH_TASK_*.
  env:
    CI: "true"
  timeout: 2h
  # Stop an agent that wrote no output for this long, and start the ticket
  # again. 0s (the default): never. A long silent command, such as a slow
  # test suite, looks the same as a hung agent, so keep it well above the
  # longest step you expect.
  stall_timeout: 30m
  # A failed run whose final message (plain adapter: the end of its output)
  # matches one of these regular expressions failed for a temporary reason,
  # and ochell starts the ticket again after a wait: backoff after the first
  # attempt, doubled with each further one, up to max_backoff. Every retry
  # counts as an attempt (max_attempts). These are the defaults;
  # "patterns: []" turns the retry off.
  retry:
    patterns:
      - '(?i)rate[ _-]?limit'
      - '(?i)too many requests'
      - '(?i)overloaded'
      - '(?i)api error:? *\(?(429|5\d\d)'
      - '(?i)service unavailable|bad gateway|gateway time-?out'
      - '(?i)connection (reset|refused|timed out)'
    backoff: 1m
    max_backoff: 30m
  max_concurrent: 1
  # How many runs one ticket may have (0: no limit). A ticket that has used
  # them up waits for a human; "ochell reset <jira|linear> <KEY>" sets the
  # count back.
  max_attempts: 5
  queue_size: 100
  log_dir: /var/log/ochell

sources:
  # Jira system webhook (Settings > System > WebHooks) with a secret.
  # Suggested JQL filter: assignee = <bot accountId>
  jira_webhook:
    enabled: true
    path: /webhooks/jira
    secret: ${JIRA_WEBHOOK_SECRET}
    bot_account_id: "712020:00000000-0000-0000-0000-000000000000"
    # Optional: the Jira accountIds of the people who may assign work. An
    # assignment by anyone else is rejected with 403. Empty: everyone.
    allowed_assigners: []
    # Optional: who may send follow-ups and stops in comments on a ticket.
    # Jira accountIds, and the words "assigner" (who assigned this ticket to
    # the bot) and "reporter" (the ticket's reporter). Empty: the same
    # people as allowed_assigners.
    allowed_follow_ups: []      # e.g. [assigner, reporter]
    # A payload whose "timestamp" is further than this from now is rejected,
    # so a captured request cannot be replayed later. Jira retries a failed
    # delivery up to five times, 5 to 15 minutes apart, and a retry may carry
    # the timestamp of the event, so keep this above 75 minutes.
    max_skew: 2h

  # Jira Automation "Send web request" with a hidden header.
  jira_automation:
    enabled: true
    path: /webhooks/jira-automation
    header: Authorization   # Automation sends "Authorization: Bearer <token>"
    token: ${JIRA_AUTOMATION_TOKEN}
    # When set, the payload must name this account as the assignee: another
    # assignee is ignored, no assignee is rejected with 400. Leave it out
    # only if the rule's own condition is all you want to rely on.
    bot_account_id: "712020:00000000-0000-0000-0000-000000000000"
    # Optional, as above. The rule's body must then carry who triggered it:
    # "initiatorAccountId": "{{initiator.accountId}}".
    allowed_assigners: []

  # ochell's own access to the Jira REST API, as the digital employee's
  # account. Leave base_url out to run without it. Check it with
  # "ochell jira-check".
  jira_api:
    base_url: https://example.atlassian.net
    email: digital.employee@example.com
    token: ${JIRA_API_TOKEN}
    # Which tickets are the bot's open tickets. This is the default.
    jql: "assignee = currentUser() AND statusCategory != Done"
    # With the API, ochell comments on a Jira ticket when a run starts and
    # when it ends. Optional: also move the ticket to this status when the
    # agent reports its work as done.
    review_status: ""       # e.g. "In Review"

  # Linear agent app (OAuth app installed with actor=app).
  linear:
    enabled: true
    path: /webhooks/linear
    secret: ${LINEAR_WEBHOOK_SECRET}
    max_skew: 60s
    client_id: ${LINEAR_CLIENT_ID}
    client_secret: ${LINEAR_CLIENT_SECRET}
    redirect_url: https://example.ngrok-free.app/oauth/linear/callback
    callback_path: /oauth/linear/callback
    token_file: /var/lib/ochell/linear-token.json
    # Optional: the Linear user ids or email addresses of the people who may
    # delegate work. Empty: everyone.
    allowed_assigners: []
    # Optional: who may send follow-ups and stops in an agent session.
    # Linear user ids or email addresses, and the word "assigner" (who
    # delegated this issue). Empty: the same people as allowed_assigners.
    allowed_follow_ups: []      # e.g. [assigner]
    # While the agent runs (claude adapter), its tool use is shown in the
    # session as "action" activities: at most one per this interval. Only
    # the tool's name and the file, pattern, host or program it works on
    # are shown. 0s: none.
    tool_activity_interval: 30s
    organization_id: ""     # optional: only accept installs into this workspace
    external_url: ""        # optional: e.g. https://runs.example.com/{{.ID}}

# In-process source IP filtering. Use it when the orchestrator is reached
# directly; behind ngrok prefer ngrok's restrict-ips (see ngrok-policy.yaml).
ip_allowlist:
  enabled: false
  atlassian_feed: true
  linear_feed: true
  extra_cidrs: []
  refresh: 1h
  trust_proxy_header: false

# Keeps ngrok IP policies in sync with the Atlassian and Linear feeds.
ngrok_sync:
  enabled: false
  api_key: ${NGROK_API_KEY}
  atlassian_policy_id: ipp_xxxxxxxxxxxxxxxxxxxxxxxxxxx
  linear_policy_id: ipp_yyyyyyyyyyyyyyyyyyyyyyyyyyy
  interval: 6h
