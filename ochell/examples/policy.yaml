# ochell example policy: the risk tiers, and which tier a ticket runs under.
#
# Point ochell at this file with policy.file in config.yaml. Keep it where
# the agent cannot write: ochell refuses a file that its group or others can
# write to, or that belongs to anyone but root or ochell's own user. Change
# it through a reviewed pull request; that review is where people decide how
# much autonomy a class of work gets. "ochell policy-check" reads it as
# "ochell serve" does.

# Recorded with every run. Leave it out to use a hash of this file.
version: "2026-11"

# Who answers for this policy.
owners:
  - platform-team@example.com

# The tiers, from the lowest to the highest: from the most autonomy to the
# least. An escalation moves a ticket up this list.
#   plan_gate:  skip | required   (default skip)
#   pr_review:  required | sampled   (default required)
#   auto_merge: never | after_ci   (default never)
#   budget_usd: what one ticket may cost; 0 or left out: no limit. It needs
#               agent.adapter claude; "ochell reset" starts it anew
#   max_turns:  how many turns one run may take; 0 or left out: no limit.
#               It needs agent.adapter claude
#   labels:     a ticket with one of these labels gets at least this tier
#   grants:     the tools and credentials of the tier's runs:
#                 mcp_config        a file with the tier's MCP servers
#                 env               variables for the agent (not secrets)
#                 credentials_file  secrets as NAME=VALUE lines; mode 0600
#                 mint, revoke      commands that make credentials for one
#                                   run, and take them back after it
#   paused:     true holds the tickets of this tier
#   max_concurrent: how many tickets of this tier may have an agent running
#               at the same time; 0 or left out: no limit of its own
#   approvers:  who may approve a plan of this tier, with "/approve" on the
#               ticket. Left out: everyone who may send follow-ups
#   allowed_assigners: who may assign work of this tier (Jira accountIds,
#               Linear user ids or email addresses); it narrows the
#               allowed_assigners of the source. Left out: everyone whom
#               the source allows
tiers:
  - name: low
    plan_gate: skip
    pr_review: required
    auto_merge: never
    budget_usd: 5
  - name: normal
    plan_gate: skip
    pr_review: required
    auto_merge: never
    budget_usd: 20
  - name: high
    plan_gate: required
    pr_review: required
    auto_merge: never
    budget_usd: 50
    labels: [risk-high, security]
    allowed_assigners: ["557058:team-lead", team.lead@example.com]
    max_concurrent: 1

# Hard controls. "paused: true" here holds every ticket, and in a tier the
# tickets of that tier, until the file is changed and ochell restarted. The
# commands "ochell pause" and "ochell resume" do the same on a running
# ochell.
paused: false

# Throttles hold new runs when a limit is reached. 0 or left out: no limit.
throttles:
  max_runs_per_hour: 20        # runs that may start within one hour
  max_open_prs_per_repo: 5     # open pull requests of the bot in one repository
  daily_spend_usd: 100         # what the runs of one day (UTC) may cost; needs agent.adapter claude

# Scheduling: which queued ticket starts next, and which waits. The queue is
# always in the order of the tracker's priority (the most urgent first, a
# ticket without a priority last), and by age within one priority.
scheduling:
  # How many tickets of one repository may have an agent running at the
  # same time. 0 or left out: no limit.
  max_concurrent_per_repo: 2
  # wait: a ticket that the tracker calls blocked by another, open ticket
  # (Jira: the link "is blocked by"; Linear: the relation "blocks") waits
  # until that one is done. ignore (the default): it starts.
  blocked_by: wait
  # Labels that a ticket must carry before its work starts: every one of
  # them, each put there by a person. A label that the bot account added
  # does not count. Left out: none.
  # required_labels: [agent-ready]
  # How often ochell asks the tracker about the tickets that blocked_by or
  # required_labels hold. Both are read from the tracker's API, so Jira
  # needs sources.jira_api.
  check_interval: 1m
  # The rank of a Jira priority by its name, from 1 (the most urgent) to 5,
  # for a site with names of its own. Highest, High, Medium, Low and Lowest
  # (and Blocker, Critical, Major, Minor, Trivial) are known already.
  # priorities: {P0: 1, P1: 2, P2: 3}

# Graduated autonomy: each tier has a level, which holds back what the tier
# allows until an operator has promoted it ("ochell promote <tier>"). The
# level a tier has now is not in this file; ochell keeps it in its store.
#   observe     every ticket gets a run that only plans, and waits for /approve
#   assisted    the tier's own plan_gate; pr_review counts as required
#   autonomous  pr_review: sampled of the tier counts
#   auto-merge  auto_merge: after_ci counts; only for the lowest tier, and
#               only by a promotion
# Left out: there are no levels, and every tier holds as it is written.
autonomy:
  # The level of a tier whose level nobody has changed yet: observe,
  # assisted or autonomous.
  start_level: assisted
  # When ochell takes one level away by itself: more than sent_back_rate of
  # the tier's tickets with a pull request were sent back by a person with a
  # follow-up ("sent back" of "ochell outcomes"), counted over the window
  # and since the level last changed, with at least min_sample such tickets.
  demote:
    sent_back_rate: 0.3      # above 0, at most 1 (1: never); default 0.3
    window: 336h             # default 336h (14 days)
    min_sample: 5            # default 5

# The tier of a ticket that no rule matches.
default_tier: normal

# The first rule that matches a ticket gives its tier. A rule matches when
# every field it sets matches: source (jira | linear), project (the part of
# the ticket key before the number), repo (as in "repos" of config.yaml) and
# issue_type (Jira only).
rules:
  - {source: jira, project: OPS, issue_type: Bug, tier: low}
  - {repo: "git@github.com:example/docs.git", tier: low}
  - {project: PAY, tier: high}
