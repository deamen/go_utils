# ochell example policy: the risk tiers, and which tier a ticket runs under.
#
# Point ochell at this file with policy.file in config.yaml. Keep it where
# the agent cannot write: ochell refuses a file that its group or others can
# write to, or that belongs to anyone but root or ochell's own user. Change
# it through a reviewed pull request; that review is where people decide how
# much autonomy a class of work gets. "ochell policy-check" reads it as
# "ochell serve" does.

# Recorded with every run. Leave it out to use a hash of this file.
version: "2026-11"

# Who answers for this policy.
owners:
  - platform-team@example.com

# The tiers, from the lowest to the highest: from the most autonomy to the
# least. An escalation moves a ticket up this list.
#   plan_gate:  skip | required   (default skip)
#   pr_review:  required | sampled   (default required)
#   auto_merge: never | after_ci   (default never)
#   budget_usd: what one ticket may cost; 0 or left out: no limit. It needs
#               agent.adapter claude; "ochell reset" starts it anew
#   labels:     a ticket with one of these labels gets at least this tier
#   allowed_assigners: who may assign work of this tier (Jira accountIds,
#               Linear user ids or email addresses); it narrows the
#               allowed_assigners of the source. Left out: everyone whom
#               the source allows
tiers:
  - name: low
    plan_gate: skip
    pr_review: required
    auto_merge: never
    budget_usd: 5
  - name: normal
    plan_gate: skip
    pr_review: required
    auto_merge: never
    budget_usd: 20
  - name: high
    plan_gate: required
    pr_review: required
    auto_merge: never
    budget_usd: 50
    labels: [risk-high, security]
    allowed_assigners: ["557058:team-lead", team.lead@example.com]

# The tier of a ticket that no rule matches.
default_tier: normal

# The first rule that matches a ticket gives its tier. A rule matches when
# every field it sets matches: source (jira | linear), project (the part of
# the ticket key before the number), repo (as in "repos" of config.yaml) and
# issue_type (Jira only).
rules:
  - {source: jira, project: OPS, issue_type: Bug, tier: low}
  - {repo: "git@github.com:example/docs.git", tier: low}
  - {project: PAY, tier: high}
